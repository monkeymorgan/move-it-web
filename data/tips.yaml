# Posture cues shown alongside break suggestions.
sitting:
  - Sit on the edge of the chair — avoid the backrest
  - Chin tucked in
  - Shoulders relaxed
  - Feet flat on the floor
  - Glutes ten percent
  - Face relaxed
  - Don't cross your legs
  - Screen low, eyes down, long neck
  - Write down your distractions
standing:
  - Feet hip width — not together
  - Outside of the foot pointing straight ahead
  - Bring your pelvis back over your heels
  - Soft knees — don't lock them
  - Can you wriggle your toes? If not, bring your weight back
  - Neck long — check for nerd neck
  - Raise your arches (rotate the thighs outwards)
  - Keep switching postures — don't stand more than 60 minutes straight
general:
  - Move more, move mindfully, breathe deeply
  - Exhale slowly
  - Use it or lose it
  - Do a body scan — where's the tension?
  - Get the shoes off when you can
  - Look out the window. Focus far away
