# Your curation of exercises.yaml.
#
#   star: the best ones — favoured heavily in break suggestions
#   keep: good, normal weight
#   drop: never suggested, hidden from the library by default
#
# Anything not listed is "unsorted" and is still eligible for breaks (lower weight),
# until you've curated enough that you switch on "only suggest curated" in Settings.
#
# Easiest workflow: use the Curate tab in the app, then "Export curation.yaml"
# and replace this file with the download.

